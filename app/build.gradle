plugins { id 'com.android.application' }

android {
    namespace 'com.ymaphone.hebrewtheme'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ymaphone.hebrewtheme'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        release {
            initWith signingConfigs.debug
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}
